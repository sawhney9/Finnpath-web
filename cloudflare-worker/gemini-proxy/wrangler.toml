name = "finnpath-gemini-proxy"
main = "worker.js"
compatibility_date = "2026-11-01"

# Secrets (NEVER put real values here — set them with `wrangler secret put`)
# Run: wrangler secret put GEMINI_API_KEY
# Then paste in your NEW rotated key when prompted.

# Per-IP rate limit for GET /stats (RSU planner price lookups).
[[ratelimits]]
name = "PRICE_LIMITER"
namespace_id = "2001"

  [ratelimits.simple]
  limit = 20
  period = 60

# Per-IP limit for the Gemini routes (/401k, /pulse).
[[ratelimits]]
name = "AI_LIMITER"
namespace_id = "2002"

  [ratelimits.simple]
  limit = 10
  period = 60

# 12h cache for /stats results. Create once with:
#   npx wrangler kv namespace create PRICE_CACHE
# then paste the printed id below.
[[kv_namespaces]]
binding = "PRICE_CACHE"
id = "a559b24f6ac74d119686e76997b0d1eb"

# Global daily cap on Gemini calls (see AiBudget in worker.js).
[[durable_objects.bindings]]
name = "AI_BUDGET"
class_name = "AiBudget"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["AiBudget"]
